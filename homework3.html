<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework 3 - LLN and CLT</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">

        <h1>Homework 3 - Penetration Process Simulation</h1>

        <div class="navigation">
            <a href="index.html">Back to Home</a>
        </div>

        <section class="card">

            <h2>Parameters</h2>

            <div class="controls">

                <div>
                    <label>Model</label>
                    <select id="model">
                        <option value="bernoulli">Bernoulli</option>
                        <option value="rademacher">Rademacher</option>
                    </select>
                </div>

                <div>
                    <label>Attackers (m)</label>
                    <input type="number" id="m" value="1000" min="10">
                </div>

                <div>
                    <label>Probability p</label>
                    <input type="number"
                           id="p"
                           value="0.3"
                           min="0"
                           max="1"
                           step="0.01">
                </div>

                <button id="runBtn">
                    Run Simulation
                </button>

            </div>

        </section>

        <section class="card">
            <h2>Sample Trajectories (largest n)</h2>
            <canvas id="trajectoryChart"></canvas>
        </section>

        <section class="card">
            <h2>Distribution of Sₙ</h2>
            <canvas id="snChart"></canvas>
        </section>

        <section class="card">
            <h2>Distribution of Sₙ / n</h2>
            <canvas id="avgChart"></canvas>
        </section>

        <section class="card">
            <h2>Distribution of Sₙ / √n</h2>
            <canvas id="normChart"></canvas>
        </section>

        <section id="statsBox" class="card"></section>

        <section id="discussionBox" class="card"></section>

    </div>

    <script src="homework3.js"></script>

</body>

</html>
