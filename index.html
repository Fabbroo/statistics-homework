<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECC Toy Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Elliptic Curve Cryptography Demo</h1>

        <p class="description">
            Demonstration of public key generation using elliptic-curve
            scalar multiplication on the toy curve:
        </p>

        <div class="equation">
            y² = x³ + 7 (mod 17)
        </div>

        <div class="info">
            <p><strong>Base Point (G):</strong> (1, 5)</p>
            <p><strong>Private Key (k):</strong> 6</p>
        </div>

        <h2>Scalar Multiplication Steps</h2>

        <div id="steps"></div>

        <h2>Toy Public Key</h2>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
