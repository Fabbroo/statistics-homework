<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECC Toy Curve Visualization</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Elliptic Curve Public-Key Generation</h1>

    <p class="subtitle">
        Ethereum-style ECC demonstration using the toy curve
        y² = x³ + 7 (mod 17)
    </p>

    <div class="card">

        <div class="controls">

            <label>
                Private Key (k):
                <input type="number" id="privateKey" min="1" value="6">
            </label>

            <label>
                Speed:
                <select id="speed">
                    <option value="1000">1x</option>
                    <option value="500">2x</option>
                    <option value="250">4x</option>
                </select>
            </label>

            <button id="startBtn">
                Start Animation
            </button>

        </div>

        <div class="parameters">
            <p><strong>Curve:</strong> y² = x³ + 7 (mod 17)</p>
            <p><strong>Base Point G:</strong> (1,5)</p>
        </div>

    </div>

    <div class="visual-section">

        <div class="canvas-panel">

            <h2>Curve Visualization</h2>

            <canvas id="curveCanvas"
                    width="650"
                    height="650">
            </canvas>

        </div>

        <div class="log-panel">

            <h2>Computation Log</h2>

            <div id="log"></div>

        </div>

    </div>

    <div id="finalResult" class="resultBox"></div>

</div>

<script src="script.js"></script>

</body>
</html>
